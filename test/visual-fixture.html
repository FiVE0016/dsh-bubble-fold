<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dsh-bubble-fold visual check</title>
<style>
  /* Host-like look: mirrored from @deepseek-ai/dsh-client-ui-chat 0.2.0-rc.2 */
  :root { --dsw-alias-bg-base: #fff; }
  body {
    margin: 0; background: #f7f8fa; color: #1f2328;
    font: 14px/1.4 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #scroll {
    width: 760px; margin: 0 auto; padding: 16px 12px 60px; background: #f7f8fa;
    display: flex; flex-direction: column;
  }
  .flowItem { min-width: 0; margin-top: 6px; }
  .userRow { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .userStack { min-width: 0; max-width: 70%; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .bubble {
    background: #dce8ff; border-radius: 18px; max-width: 100%;
    font-size: 14px; line-height: 22px; white-space: pre-wrap; word-break: break-word; padding: 10px 16px;
  }
  .mdRoot { display: flex; flex-direction: column; gap: 4px; }
  .mdBody { font-size: 14px; line-height: 24px; white-space: pre-wrap; word-break: break-word; }
  .tpRow {
    box-sizing: border-box; width: 100%; min-width: 0; height: 33px; border: none;
    border-bottom: .5px solid rgba(15,23,42,.15); color: #8b93a1; font: inherit; font-size: 14px;
    cursor: pointer; text-align: left; background: transparent; align-items: center; padding: 0 0 8px;
    display: flex;
  }
  .tpRow:disabled { cursor: default; }
  .tpLabel { min-width: 0; font-size: inherit; line-height: 24px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
  .tpChev { width: 14px; height: 14px; color: inherit; flex: none; margin-left: 4px; transition: transform .1s; }
  .tpRow[data-open] .tpChev { transform: rotate(180deg); }
  /* step container (ChatGroupSeat) */
  .groupRoot { display: flex; flex-direction: column; }
  .groupHeader {
    display: flex; align-items: center; gap: 6px; width: 100%; border: none; background: none;
    color: #8b93a1; font: inherit; font-size: 13px; cursor: pointer; text-align: left; padding: 2px 0;
  }
  .groupHeader[hidden] { display: none; }
  .groupBody { display: flex; flex-direction: column; }
  .groupBody[hidden] { display: none; }
  .member {
    display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 10px;
    border: 1px solid rgba(15,23,42,.12); border-radius: 10px; background: #fff;
    color: #68707d; font-size: 13px; line-height: 20px;
  }
  .member[hidden] { display: none; }
</style>
</head>
<body>
<div id="scroll">

  <!-- ============ TURN 1 (history): everything folds ============ -->
  <div class="flowItem" data-chat-flow-kind="user" data-chat-turn="1" data-chat-anchor-key="user:1">
    <div class="userRow"><div class="userStack"><div class="bubble" id="userLong1"></div></div></div>
  </div>

  <!-- work-details compact/standard layout: steps nested in a step container, and a
       summary row the host will not fold. The seam drives the group header. -->
  <div class="flowItem" data-chat-flow-kind="turn-process" data-chat-turn="1" data-chat-anchor-key="turn-process:1">
    <button type="button" class="tpRow" data-turn-process="1" disabled>
      <span class="tpLabel">已完成，用时 11分42秒</span>
    </button>
  </div>
  <div class="flowItem groupRoot" data-chat-group-key="group:1" data-chat-flow-key="group:1"
       data-chat-turn="1" data-chat-anchor-key="group:1" data-step-process>
    <div>
      <button type="button" class="groupHeader" aria-expanded="true" aria-controls="body-1">
        <span data-step-process-icon>🔧</span><span>已工作 · 3 步</span>
      </button>
    </div>
    <div class="groupBody" id="body-1" data-step-process-body>
      <div data-step-process-content>
        <div class="member" data-chat-flow-kind="tool-call" data-turn-process-member>🔧 read · 读取 browser.js</div>
        <div class="member" data-chat-flow-kind="assistant-step" data-turn-process-member>💭 思考：宿主契约</div>
        <div class="member" data-chat-flow-kind="tool-call" data-turn-process-member>🔧 grep · 搜索 收起步骤</div>
      </div>
    </div>
  </div>
  <div class="flowItem" data-chat-flow-kind="assistant-step" data-chat-turn="1" data-chat-anchor-key="answer:1">
    <div class="mdRoot"><div class="mdBody" id="replyLong1"></div></div>
  </div>

  <!-- ============ TURN 2 (newest): messages stay open, steps fold ============ -->
  <div class="flowItem" data-chat-flow-kind="user" data-chat-turn="2" data-chat-anchor-key="user:2">
    <div class="userRow"><div class="userStack"><div class="bubble" id="userLong2"></div></div></div>
  </div>

  <!-- work-details verbose layout: a dead summary row and the steps inline, so the
       plugin folds these rows itself. -->
  <div class="flowItem" data-chat-flow-kind="turn-process" data-chat-turn="2" data-chat-anchor-key="turn-process:2">
    <button type="button" class="tpRow" data-turn-process="2" disabled>
      <span class="tpLabel">已完成，用时 2分07秒</span>
    </button>
  </div>
  <div class="flowItem member" data-chat-flow-kind="tool-call" data-chat-turn="2" data-turn-process-member>🔧 edit · 修改 syncStepFolds</div>
  <div class="flowItem member" data-chat-flow-kind="tool-call" data-chat-turn="2" data-turn-process-member>🔧 pwsh · 运行测试</div>
  <div class="flowItem" data-chat-flow-kind="assistant-step" data-chat-turn="2" data-chat-anchor-key="answer:2">
    <div class="mdRoot"><div class="mdBody" id="replyLong2"></div></div>
  </div>

</div>
<script>
  const line = (i) => '这是第 ' + (i + 1) + ' 行用于验证折叠效果的内容，长度足够产生换行与高度。'
  const paragraphs = (label, count) => Array.from({ length: count }, (_, i) => label + '第 ' + (i + 1) + ' 行：' + line(i)).join('\n')
  document.getElementById('userLong1').textContent = paragraphs('旧输入', 24)
  // Short enough that the whole fixture fits the viewport gate, still far over the
  // 6-line user budget, so "the newest turn stays open" is a real assertion.
  document.getElementById('userLong2').textContent = paragraphs('最新输入', 12)
  document.getElementById('replyLong1').textContent = paragraphs('旧回复', 24)
  document.getElementById('replyLong2').textContent = paragraphs('最新回复', 16)

  // Host behaviour: each summary row owns its own state and hides its members.
  const membersAfter = (node) => {
    const steps = []
    for (let item = node.nextElementSibling; item && item.hasAttribute('data-turn-process-member'); item = item.nextElementSibling) steps.push(item)
    return steps
  }
  for (const row of document.querySelectorAll('[data-turn-process]')) {
    row.addEventListener('click', () => {
      if (row.disabled) return
      const open = !row.hasAttribute('data-open')
      if (open) row.setAttribute('data-open', '')
      else row.removeAttribute('data-open')
      for (const step of membersAfter(row)) {
        if (open) step.removeAttribute('hidden')
        else step.setAttribute('hidden', 'until-found')
      }
    })
  }
  // The group header owns the container's own disclosure.
  for (const header of document.querySelectorAll('.groupHeader')) {
    header.addEventListener('click', () => {
      const open = header.getAttribute('aria-expanded') !== 'true'
      header.setAttribute('aria-expanded', String(open))
      const body = document.getElementById(header.getAttribute('aria-controls'))
      if (open) body.removeAttribute('hidden')
      else body.setAttribute('hidden', 'until-found')
    })
  }

  // Minimal host loader, exactly what the real page provides.
  window.__ModuleLoader__ = {
    load(registration) { window.__REG__ = registration },
    require(name) { throw new Error('unexpected host module request: ' + name) }
  }
</script>
<script src="../client.js"></script>
<script>
  (() => {
    const registration = window.__REG__
    if (!registration) throw new Error('bundle never registered')
    const plugin = registration.factory((spec) => {
      if (spec === 'react') return { createElement: () => null }
      throw new Error('missed: ' + spec)
    })
    window.__PLUGIN__ = plugin
    window.__DISPOSE__ = plugin.apply({})
    window.__DSH_BUBBLE_FOLD__.rescan()
  })()
</script>
</body>
</html>
